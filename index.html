<!-- DAILY LEDGER SECTION -->
<div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 space-y-6 mt-8">
  <div class="flex justify-between items-center border-b pb-3">
    <h2 class="text-xl font-bold text-gray-800">ڊيلي ليجر اپڊيٽ (Daily Ledger / Daily Cashbook)</h2>
    <input type="date" id="ledger_filter_date" onchange="loadDailyLedger()" class="p-2 border rounded-md text-sm">
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- 1. Add New Ledger Entry Form -->
    <form onsubmit="handleDailyLedgerSubmit(event)" class="space-y-4 bg-gray-50 p-4 rounded-lg border">
      <h3 class="font-semibold text-gray-700">نئين اينٽري داخل ڪريو (Add Entry)</h3>

      <div>
        <label class="block text-xs font-medium text-gray-700">اينٽري جو قسم (Type)</label>
        <select id="ledger_type" required class="w-full mt-1 p-2 border rounded-md bg-white">
          <option value="Expense">خرچ (Expense / پئسا ويا)</option>
          <option value="Income">آمدني (Income / پئسا آيا)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700">ڪئٽيگري (Category)</label>
        <input type="text" id="ledger_category" required placeholder="مثال: دوڪان جو ڪرائي، چانهه جو خرچ، وغيره" class="w-full mt-1 p-2 border rounded-md">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700">رقم (Amount in PKR)</label>
        <input type="number" id="ledger_amount" required placeholder="0" class="w-full mt-1 p-2 border rounded-md">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700">ادائگي جو اڪائونٽ (Payment Account)</label>
        <select id="ledger_account_id" class="w-full mt-1 p-2 border rounded-md bg-white">
          <option value="1">Cash Wallet</option>
          <option value="2">Meezan Bank</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700">تفصيل / تفصيلي نوٽ (Description)</label>
        <input type="text" id="ledger_desc" placeholder="خرچ يا آمدنيءَ جي تفصيل" class="w-full mt-1 p-2 border rounded-md">
      </div>

      <button type="submit" id="ledger-submit-btn" class="w-full bg-slate-800 text-white py-2 rounded-md hover:bg-slate-900 font-semibold text-sm transition">
        اينٽري محفوظ ڪريو
      </button>
    </form>

    <!-- 2. Today's Summary & Transaction History -->
    <div class="md:col-span-2 space-y-4">
      <!-- Daily Summary Cards -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
          <p class="text-xs text-green-700 font-semibold">اڄ جي مڪمل آمدني (Total Income)</p>
          <h3 id="daily_total_income" class="text-2xl font-bold text-green-800">PKR 0</h3>
        </div>
        <div class="bg-red-50 border border-red-200 p-4 rounded-lg">
          <p class="text-xs text-red-700 font-semibold">اڄ جو مڪمل خرچ (Total Expense)</p>
          <h3 id="daily_total_expense" class="text-2xl font-bold text-red-800">PKR 0</h3>
        </div>
      </div>

      <!-- History Table -->
      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-sm text-right text-gray-600">
          <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
            <tr>
              <th class="py-2 px-3">قسم</th>
              <th class="py-2 px-3">ڪئٽيگري</th>
              <th class="py-2 px-3">تفصيل</th>
              <th class="py-2 px-3">رقم</th>
            </tr>
          </thead>
          <tbody id="daily_ledger_list">
            <!-- Dynamically Rendered -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- JavaScript Logic -->
<script>
  // Set default date picker to today
  document.getElementById('ledger_filter_date').valueAsDate = new Date();

  // Load Daily Ledger on Page Load
  document.addEventListener("DOMContentLoaded", () => {
    loadDailyLedger();
  });

  // Handle Adding New Daily Ledger Entry
  async function handleDailyLedgerSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('ledger-submit-btn');
    btn.disabled = true;
    btn.innerText = "محفوظ ٿي رھيو آھي...";

    const type = document.getElementById('ledger_type').value;
    const category = document.getElementById('ledger_category').value;
    const amount = parseFloat(document.getElementById('ledger_amount').value);
    const account_id = document.getElementById('ledger_account_id').value;
    const description = document.getElementById('ledger_desc').value;

    // Insert into daily_ledger table
    const { error } = await supabase.from('daily_ledger').insert([{
      entry_type: type,
      category: category,
      amount: amount,
      payment_account_id: account_id,
      description: description
    }]);

    if (error) {
      alert("اينٽري محفوظ ڪرڻ ۾ غلطي: " + error.message);
    } else {
      alert("ليجر اينٽري کاميابي سان محفوظ ٿي وئي!");
      e.target.reset();
      loadDailyLedger();
    }

    btn.disabled = false;
    btn.innerText = "اينٽري محفوظ ڪريو";
  }

  // Load and Filter Ledger Entries by Selected Date
  async function loadDailyLedger() {
    const selectedDate = document.getElementById('ledger_filter_date').value;
    if (!selectedDate) return;

    const { data, error } = await supabase
      .from('daily_ledger')
      .select('*')
      .eq('entry_date', selectedDate)
      .order('created_at', { ascending: false });

    const listBody = document.getElementById('daily_ledger_list');
    listBody.innerHTML = '';

    let totalIncome = 0;
    let totalExpense = 0;

    if (data && data.length > 0) {
      data.forEach(item => {
        if (item.entry_type === 'Income') totalIncome += item.amount;
        if (item.entry_type === 'Expense') totalExpense += item.amount;

        const isIncome = item.entry_type === 'Income';
        listBody.innerHTML += `
          <tr class="border-b">
            <td class="py-2 px-3 font-semibold ${isIncome ? 'text-green-600' : 'text-red-600'}">
              ${isIncome ? 'آمدني (Income)' : 'خرچ (Expense)'}
            </td>
            <td class="py-2 px-3">${item.category}</td>
            <td class="py-2 px-3 text-gray-500">${item.description || '-'}</td>
            <td class="py-2 px-3 font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">
              PKR ${item.amount}
            </td>
          </tr>
        `;
      });
    } else {
      listBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-400">ان تاريخ جي ڪا اينٽري موجود ناهي.</td></tr>';
    }

    document.getElementById('daily_total_income').innerText = `PKR ${totalIncome}`;
    document.getElementById('daily_total_expense').innerText = `PKR ${totalExpense}`;
  }
</script>
