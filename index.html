<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting & Employee Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Accounting & HR System</h1>
            <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full">Admin Panel</span>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- LEFT COLUMN: Forms -->
        <div class="space-y-6">
            
            <!-- Form 1: Create New Account -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold text-indigo-600 mb-4 border-b pb-2">Create New Account</h2>
                <form id="createAccountForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Account Name</label>
                        <input type="text" id="accName" required class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Category</label>
                        <select id="accCategory" onchange="toggleEmployeeFields()" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Employee">Employee (Office)</option>
                            <option value="Customer">Customer</option>
                            <option value="Supplier">Supplier</option>
                            <option value="Office">Office Expense</option>
                        </select>
                    </div>
                    <div id="salaryField">
                        <label class="block text-xs font-medium text-gray-700">Base Salary (PKR)</label>
                        <input type="number" id="accSalary" value="0" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md text-sm transition">Create Account</button>
                </form>
            </div>

            <!-- Form 2: Add Transaction / Payment / Bonus -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold text-indigo-600 mb-4 border-b pb-2">Add Transaction / Ledger Entry</h2>
                <form id="transactionForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Select Account</label>
                        <select id="transAccountSelect" required class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Entry Type</label>
                        <select id="transType" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Payment_In">Payment Received (In)</option>
                            <option value="Payment_Out">Payment Given (Out)</option>
                            <option value="Credit">Credit / Credit Purchase (اوڌار)</option>
                            <option value="Salary">Salary Payout</option>
                            <option value="Bonus">Bonus</option>
                            <option value="Commission">Commission</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Amount (PKR)</label>
                            <input type="number" id="transAmount" required value="0" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Quantity (Item/Qty)</label>
                            <input type="number" id="transQty" value="0" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Notes / Details</label>
                        <input type="text" id="transNotes" placeholder="e.g. Monthly Bonus or Item details" class="w-full mt-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-md text-sm transition">Post Entry</button>
                </form>
            </div>

        </div>

        <!-- RIGHT COLUMN: First Page / Dashboard (Employees & Ledger Summary) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Employee First Page Section -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-800">Employee Accounts (First Page)</h2>
                    <span class="text-xs text-gray-500">Auto-calculated Ledger</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600">
                                <th class="p-3">Name</th>
                                <th class="p-3">Base Salary</th>
                                <th class="p-3">Commission / Bonus</th>
                                <th class="p-3">Total Paid</th>
                                <th class="p-3">Pending / Credit</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- All Accounts Overview -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">All Accounts Directory</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600">
                                <th class="p-3">ID</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Created Date</th>
                            </tr>
                        </thead>
                        <tbody id="allAccountsTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Script Section -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://rdpxpaiqzfhtojhigmyf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkcHhwYWlxemZodG9qaGlnbXlmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTg1NjgxNywiZXhwIjoyMTA1NDMyODE3fQ.2uh68q3qBLAXk9xUAUDSb5ZRj1DJViKhwj_NzpnzDiE';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Toggle Salary Field Based on Category
        function toggleEmployeeFields() {
            const cat = document.getElementById('accCategory').value;
            const salaryField = document.getElementById('salaryField');
            if (cat === 'Employee') {
                salaryField.classList.remove('hidden');
            } else {
                salaryField.classList.add('hidden');
            }
        }

        // Fetch Accounts & Populate Dropdowns and Tables
        async function loadDashboardData() {
            const { data: accounts, error: accErr } = await db.from('accounts').select('*');
            const { data: transactions, error: transErr } = await db.from('transactions').select('*');

            if (accErr || transErr) {
                console.error("Data Fetch Error:", accErr || transErr);
                return;
            }

            const selectEl = document.getElementById('transAccountSelect');
            const empTableEl = document.getElementById('employeeTableBody');
            const allAccTableEl = document.getElementById('allAccountsTableBody');

            selectEl.innerHTML = '';
            empTableEl.innerHTML = '';
            allAccTableEl.innerHTML = '';

            accounts.forEach(acc => {
                // Populate Dropdown
                const option = document.createElement('option');
                option.value = acc.id;
                option.textContent = `${acc.name} (${acc.category})`;
                selectEl.appendChild(option);

                // Populate All Accounts Table
                allAccTableEl.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">#${acc.id}</td>
                        <td class="p-3 font-medium">${acc.name}</td>
                        <td class="p-3"><span class="px-2 py-1 text-xs rounded bg-blue-100 text-blue-700">${acc.category}</span></td>
                        <td class="p-3 text-xs text-gray-500">${new Date(acc.created_at).toLocaleDateString()}</td>
                    </tr>
                `;

                // Calculate Employee Balances (First Page)
                if (acc.category === 'Employee') {
                    const userTrans = transactions.filter(t => t.account_id === acc.id);
                    
                    let totalBonusComm = 0;
                    let totalPaid = 0;
                    let totalCredit = 0;

                    userTrans.forEach(t => {
                        if (t.type === 'Bonus' || t.type === 'Commission') totalBonusComm += Number(t.amount);
                        if (t.type === 'Payment_Out' || t.type === 'Salary') totalPaid += Number(t.amount);
                        if (t.type === 'Credit') totalCredit += Number(t.amount);
                    });

                    // Balance calculation
                    let pending = (Number(acc.base_salary) + totalBonusComm + totalCredit) - totalPaid;

                    empTableEl.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 font-medium text-gray-800">${acc.name}</td>
                            <td class="p-3">Rs. ${acc.base_salary}</td>
                            <td class="p-3 text-emerald-600 font-medium">+ Rs. ${totalBonusComm}</td>
                            <td class="p-3 text-blue-600 font-medium">Rs. ${totalPaid}</td>
                            <td class="p-3 font-semibold ${pending > 0 ? 'text-red-600' : 'text-gray-700'}">Rs. ${pending}</td>
                        </tr>
                    `;
                }
            });
        }

        // Form Submit: Create Account
        document.getElementById('createAccountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('accName').value;
            const category = document.getElementById('accCategory').value;
            const base_salary = document.getElementById('accSalary').value;

            const { error } = await db.from('accounts').insert([{ name, category, base_salary }]);
            if (error) alert(error.message);
            else {
                alert('Account Created Successfully!');
                document.getElementById('createAccountForm').reset();
                loadDashboardData();
            }
        });

        // Form Submit: Add Transaction
        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const account_id = document.getElementById('transAccountSelect').value;
            const type = document.getElementById('transType').value;
            const amount = document.getElementById('transAmount').value;
            const quantity = document.getElementById('transQty').value;
            const notes = document.getElementById('transNotes').value;

            const { error } = await db.from('transactions').insert([{ account_id, type, amount, quantity, notes }]);
            if (error) alert(error.message);
            else {
                alert('Transaction Saved Successfully!');
                document.getElementById('transactionForm').reset();
                loadDashboardData();
            }
        });

        // Initial Load
        loadDashboardData();
    </script>
</body>
</html>
