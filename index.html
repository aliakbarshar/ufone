<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بينڪ ڊپازٽ ۽ سپلائر مئنيجمينٽ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-2xl mx-auto space-y-6">

    <!-- ۱. بينڪ ۾ پئسا جمع ڪرڻ جو فارم (Bank Deposit) -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4 text-blue-700">بينڪ ۾ پئسا جمع ڪريو (Bank Deposit)</h2>
      <form onsubmit="handleBankDeposit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">جمع ٿيندڙ رقم (PKR):</label>
          <input type="number" id="deposit_amount" required class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium">بينڪ اڪائونٽ چونڊيو:</label>
          <select id="deposit_bank_account" class="w-full p-2 border rounded mt-1">
            <!-- Supabase مان اڪائونٽس لوڊ ٿيندا -->
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium">تفصيل / نوٽ:</label>
          <input type="text" id="deposit_note" placeholder="مثال: ڪيش بينڪ ۾ جمع ڪرائي وئي" class="w-full p-2 border rounded mt-1">
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">پئسا جمع ڪريو</button>
      </form>
    </div>

    <!-- ۲. نئون سپلائر شامل ڪرڻ جو فارم -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4 text-green-700">نئون سپلائر (Supplier) شامل ڪريو</h2>
      <form onsubmit="handleAddSupplier(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">سپلائر جو نالو:</label>
          <input type="text" id="supplier_name" required class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium">کمپني / فرنچائز جو نالو:</label>
          <input type="text" id="supplier_company" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium">موبائل نمبر:</label>
          <input type="text" id="supplier_phone" class="w-full p-2 border rounded mt-1">
        </div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">سپلائر اڪائونٽ ٺاهيو</button>
      </form>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // بینڪ ۾ پئسا جمع ڪرڻ جو لاجڪ
    async function handleBankDeposit(e) {
      e.preventDefault();
      const amount = document.getElementById('deposit_amount').value;
      const payment_account_id = document.getElementById('deposit_bank_account').value;
      const note = document.getElementById('deposit_note').value;

      const { data, error } = await supabase.from('transactions').insert([
        {
          type: 'Bank_Deposit',
          amount: parseFloat(amount),
          payment_account_id: payment_account_id,
          description: note || 'Cash deposited into bank'
        }
      ]);

      if (error) {
        alert("غلطي: " + error.message);
      } else {
        alert("پئسا کاميابي سان بينڪ اڪائونٽ ۾ داخل ٿي ويا!");
        e.target.reset();
      }
    }

    // سپلائر اڪائونٽ ٺاهڻ جو لاجڪ
    async function handleAddSupplier(e) {
      e.preventDefault();
      const name = document.getElementById('supplier_name').value;
      const company_name = document.getElementById('supplier_company').value;
      const phone = document.getElementById('supplier_phone').value;

      const { data, error } = await supabase.from('suppliers').insert([
        { name, company_name, phone }
      ]);

      if (error) {
        alert("سپلائر اڪائونٽ ٺاهڻ ۾ غلطي: " + error.message);
      } else {
        alert("سپلائر اڪائونٽ کاميابي سان ٺهي ويو!");
        e.target.reset();
      }
    }
  </script>
</body>
</html>
